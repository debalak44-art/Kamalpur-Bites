name: Build Kamalpur Bites APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project and Setup Gradle Wrapper
        run: |
          mkdir -p project_source
          unzip -o Kamalpur_Bites_Android_Starter-3.zip -d project_source
          ROOT_DIR=$(find project_source -name "settings.gradle*" -exec dirname {} \;)
          echo "PROJECT_ROOT=$ROOT_DIR" >> $GITHUB_ENV
          cd $ROOT_DIR
          gradle wrapper

      - name: Build Debug APK
        run: |
          cd $PROJECT_ROOT
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamalpur-Bites-APK
          path: project_source/**/build/outputs/apk/debug/*.apk
