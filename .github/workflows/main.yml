name: Inspect and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p project_dir
          unzip -o Kamalpur_Bites_Android_Starter-3.zip -d project_dir

      - name: Show Files in ZIP
        run: |
          echo "=== ZIP FILE LIST ==="
          find project_dir -maxdepth 3

