name: Build Kamalpur Bites APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract Project and Fix Code
        run: |
          mkdir -p project_source
          unzip -o Kamalpur_Bites_Android_Starter-3.zip -d project_source
          ROOT_DIR=$(find project_source -name "settings.gradle*" -exec dirname {} \;)
          echo "PROJECT_ROOT=$ROOT_DIR" >> $GITHUB_ENV
          cd $ROOT_DIR
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          
          # Fix unresolved singleLine reference
          find . -name "*.kt" -exec sed -i 's/singleLine = true/maxLines = 1/g' {} +
          find . -name "*.kt" -exec sed -i 's/singleLine = false/maxLines = Int.MAX_VALUE/g' {} +

      - name: Build Debug APK
        run: |
          cd $PROJECT_ROOT
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamalpur-Bites-APK
          path: project_source/**/build/outputs/apk/debug/*.apk

