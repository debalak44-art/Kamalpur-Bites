name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o Kamalpur_Bites_Android_Starter-3.zip -d project_dir
          find project_dir -name "gradlew" -exec chmod +x {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd $(find project_dir -name "gradlew" -printf "%h\n" | head -n 1)
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamalpur-Bites-APK
          path: project_dir/**/build/outputs/apk/debug/*.apk
        
